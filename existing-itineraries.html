<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Existing Itineraries — Costing Console</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="app" id="chrome-mount"></div>

<script src="assets/app.js"></script>
<script>
(async function () {
renderChrome('chrome-mount', { activeStep: 0, activeNav: 'existing', breadcrumbSub: 'Existing Itineraries' });
const content = document.getElementById('page-content');
content.style.gridTemplateColumns = '1fr';
content.style.maxWidth = '900px';

const saved = await getSavedItineraries();

content.innerHTML = `
  <h1 class="page-title">Existing Itineraries</h1>
  <p class="page-sub">Search saved itineraries — "Use This" loads one as a new draft to tweak and continue, "View" opens a read-only copy.</p>

  <div class="stub-banner">This list is stored in db/savedItineraries.json on the local server (via server.js) — shared across browsers on this machine, but still just a JSON file, not a real database. Filtering here is a simple text match; the city/nights-combo style search described in the proposal doc is real future work.</div>

  <div class="card">
    <div class="card-title">Reference Example (read-only, seeded)</div>
    <table class="data">
      <tr><th>Client</th><th>Duration</th><th>Cities</th><th>Pax</th><th class="right">Per Person</th></tr>
      <tr>
        <td>Priyanshu Aggarwal</td>
        <td>6N / 7D</td>
        <td>Kandy, Nuwara Eliya, Yala, Bentota, Colombo</td>
        <td>6 Adults</td>
        <td class="right num">$382</td>
      </tr>
    </table>
    <p style="font-size:11.5px;color:var(--slate);margin-top:10px;">
      This is the original full 5-city itinerary you shared — kept here for reference. It's not editable since it predates this POC's 3-city sample dataset.
    </p>
  </div>

  <div class="card">
    <div class="card-title">
      Saved Itineraries <span style="font-weight:500;color:var(--slate);font-size:12px;" id="saved-count">(${saved.length})</span>
    </div>
    <div class="field" style="margin-bottom:16px;">
      <input id="f-search" placeholder="Search by client name or city…" style="border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13.5px;">
    </div>
    <div id="saved-wrap"></div>
  </div>

  <div class="btn-row" style="justify-content:flex-start;">
    <a href="index.html"><button class="btn ghost">← Back to Dashboard</button></a>
  </div>
`;

function renderSaved(list) {
  const wrap = document.getElementById('saved-wrap');
  document.getElementById('saved-count').textContent = `(${list.length}${list.length !== saved.length ? ` of ${saved.length}` : ''})`;
  if (saved.length === 0) {
    wrap.innerHTML = `<div class="empty-state"><div class="big">Nothing saved yet</div>Complete a costing flow and click "Save Itinerary" on the Pricing Summary screen — it'll show up here.</div>`;
    return;
  }
  if (list.length === 0) {
    wrap.innerHTML = `<div class="empty-state"><div class="big">No matches</div>Try a different client name or city.</div>`;
    return;
  }
  wrap.innerHTML = `
    <table class="data">
      <tr><th>Client</th><th>Duration</th><th>Cities</th><th>Pax</th><th class="right">Grand Total</th><th class="right">Per Person</th><th></th></tr>
      ${list.map(s => `
        <tr>
          <td>${s.clientName}</td>
          <td>${s.duration.nights}N / ${s.duration.days}D</td>
          <td>${s.cities.join(', ')}</td>
          <td>${s.pax}</td>
          <td class="right num">${fmtUsd(s.grandTotal)}</td>
          <td class="right num">${fmtUsd(s.perPerson)}</td>
          <td class="right" style="white-space:nowrap;">
            <button class="icon-btn use-btn" data-id="${s.id}">Use This →</button>
            <a href="itinerary-preview.html?savedId=${encodeURIComponent(s.id)}"><button class="icon-btn">View</button></a>
          </td>
        </tr>`).join('')}
    </table>`;
  wrap.querySelectorAll('.use-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const record = saved.find(r => r.id === btn.dataset.id);
      if (!record) return;
      const cloned = JSON.parse(JSON.stringify(record.itinerarySnapshot));
      delete cloned.previewOverrides;
      saveItinerary(cloned);
      toast(`Loaded ${record.clientName}'s itinerary as a new draft — update client name/dates as needed.`);
      setTimeout(() => window.location.href = 'trip-basics.html', 500);
    });
  });
}

document.getElementById('f-search').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  const filtered = !q ? saved : saved.filter(s =>
    s.clientName.toLowerCase().includes(q) || s.cities.some(c => c.toLowerCase().includes(q)));
  renderSaved(filtered);
});

renderSaved(saved);
})();
</script>
</body>
</html>
