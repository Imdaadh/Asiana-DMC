<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pricing Summary — Costing Console</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="app" id="chrome-mount"></div>

<script src="assets/app.js"></script>
<script>
(async function () {
  const itinerary = ensureItinerary();
  if (!itinerary.tripBasics.clientName || itinerary.hotels.length === 0 || itinerary.transport.mileageSegments.length === 0) {
    window.location.href = 'trip-basics.html';
    return;
  }
  const cfg = await loadAllConfig();
  renderChrome('chrome-mount', { activeStep: 4, breadcrumbSub: breadcrumbFor(itinerary) });
  const content = document.getElementById('page-content');
  content.style.gridTemplateColumns = '1fr 340px';

  const defaultMarkup = cfg.pricingSettings.markupPercent;

  content.innerHTML = `
    <div>
      <h1 class="page-title">Pricing summary <span class="badge editable" id="mode-badge" style="vertical-align:middle;"></span></h1>
      <p class="page-sub">Cost builds up in sequence, top to bottom — exactly the order it was calculated in the earlier stages.</p>

      <div class="receipt">
        <div class="receipt-row">
          <div class="k">Accommodation Subtotal<span class="sub" id="r-acc-sub"></span></div>
          <div class="v num" id="r-acc">—</div>
        </div>
        <div class="receipt-row">
          <div class="k">Transportation Subtotal<span class="sub" id="r-trans-sub"></span></div>
          <div class="v num" id="r-trans">—</div>
        </div>
        <div class="receipt-row subtotal">
          <div class="k">Subtotal (Cost Price)<span class="sub">Accommodation + Transportation</span></div>
          <div class="v num" id="r-subtotal">—</div>
        </div>
        <div class="receipt-row markup">
          <div class="k">Markup
            <span class="sub">
              <input type="number" id="f-markup" value="${itinerary.pricing.markupPercentOverride != null ? itinerary.pricing.markupPercentOverride : defaultMarkup}"
                     style="width:52px;border:1px solid var(--config-amber-border);border-radius:5px;padding:2px 5px;font-size:11.5px;text-align:center;">% of Cost Price · default from Config, editable
            </span>
          </div>
          <div class="v num" id="r-markup">—</div>
        </div>
        <div class="receipt-row grand">
          <div class="k">Grand Total — Client Price</div>
          <div class="v num" id="r-grand">—</div>
        </div>
      </div>

      <div class="card" style="margin-top:20px;">
        <div class="card-title">Final Display to Client</div>
        <div class="toggle-row">
          <div class="toggle" id="toggle-pp">Per Person Rate</div>
          <div class="toggle" id="toggle-tb">Total Breakdown</div>
        </div>
        <div id="final-display-wrap"></div>
        <div class="btn-row">
          <button class="btn ghost" id="btn-back">← Back</button>
          <button class="btn ghost" id="btn-preview">Generate Itinerary Preview</button>
          <button class="btn primary" id="btn-generate">Save Itinerary →</button>
        </div>
      </div>
    </div>

    <div class="ledger">
      <div class="ledger-head">
        <div class="t">Costing Ledger</div>
        <div class="s">Final state for this itinerary</div>
      </div>
      <div class="ledger-body" id="ledger-body"></div>
      <div class="ledger-grand" id="ledger-grand"></div>
    </div>
  `;

  function render() {
    const pricing = computePricing(itinerary, cfg.vehicles, cfg.pricingSettings);

    document.getElementById('r-acc-sub').textContent = `${itinerary.hotels.length} cities · from Stage 2`;
    document.getElementById('r-acc').textContent = fmtUsd(displayAmount(pricing.accommodation, itinerary));
    document.getElementById('r-trans-sub').textContent = `${pricing.transport.totalKm} km + driver bata + misc · from Stage 3`;
    document.getElementById('r-trans').textContent = fmtUsd(displayAmount(pricing.transport.subtotal, itinerary));
    document.getElementById('r-subtotal').textContent = fmtUsd(displayAmount(pricing.subtotal, itinerary));
    document.getElementById('r-markup').textContent = '+ ' + fmtUsd(displayAmount(pricing.markupAmount, itinerary));
    document.getElementById('r-grand').textContent = fmtUsd(displayAmount(pricing.grandTotal, itinerary));
    document.getElementById('mode-badge').textContent = itinerary.pricing.displayMode === 'perPerson' ? 'Showing: Per Person' : 'Showing: Whole Group';

    const mode = itinerary.pricing.displayMode || 'perPerson';
    document.getElementById('toggle-pp').classList.toggle('selected', mode === 'perPerson');
    document.getElementById('toggle-tb').classList.toggle('selected', mode === 'totalBreakdown');

    const finalWrap = document.getElementById('final-display-wrap');
    if (mode === 'perPerson') {
      finalWrap.innerHTML = `
        <div class="final-display-card">
          <span class="amount num">${fmtUsd(pricing.perPerson)}</span><span class="per">/ person</span>
          <div class="cap">${pricing.pax} pax sharing · ${fmtUsd(pricing.grandTotal)} ÷ ${pricing.pax}</div>
        </div>`;
    } else {
      finalWrap.innerHTML = `
        <div class="final-display-card">
          <div style="display:flex;justify-content:space-around;text-align:left;">
            <div>
              <div style="font-size:11.5px;color:var(--slate);font-weight:700;text-transform:uppercase;">Accommodation</div>
              <div style="font-size:24px;font-weight:800;color:var(--indigo-dark);">${fmtUsd(pricing.accommodation * (1 + pricing.markupPercent/100))}</div>
            </div>
            <div>
              <div style="font-size:11.5px;color:var(--slate);font-weight:700;text-transform:uppercase;">Transportation</div>
              <div style="font-size:24px;font-weight:800;color:var(--indigo-dark);">${fmtUsd(pricing.transport.subtotal * (1 + pricing.markupPercent/100))}</div>
            </div>
          </div>
          <div class="cap" style="margin-top:12px;">Each subtotal shown with markup applied proportionally</div>
        </div>`;
    }

    const lb = document.getElementById('ledger-body');
    lb.innerHTML = `
      <div class="ledger-section">
        <div class="ledger-section-title">Trip Basics</div>
        <div class="ledger-line"><span class="k">${itinerary.tripBasics.clientName}</span><span class="v">${pricing.pax} pax</span></div>
      </div>
      <div class="ledger-section">
        <div class="ledger-section-title">Accommodation</div>
        <div class="ledger-line"><span class="k">${itinerary.hotels.length} cities</span><span class="v">${fmtUsd(displayAmount(pricing.accommodation, itinerary))}</span></div>
      </div>
      <div class="ledger-section">
        <div class="ledger-section-title">Transportation</div>
        <div class="ledger-line"><span class="k">${pricing.transport.totalKm} km · Bata · Misc</span><span class="v">${fmtUsd(displayAmount(pricing.transport.subtotal, itinerary))}</span></div>
      </div>
      <div class="ledger-section">
        <div class="ledger-section-title">Pricing</div>
        <div class="ledger-line"><span class="k">Subtotal</span><span class="v">${fmtUsd(displayAmount(pricing.subtotal, itinerary))}</span></div>
        <div class="ledger-line"><span class="k">Markup (${pricing.markupPercent}%)</span><span class="v">${fmtUsd(displayAmount(pricing.markupAmount, itinerary))}</span></div>
      </div>
    `;
    document.getElementById('ledger-grand').innerHTML = `
      <div class="k">Grand Total</div>
      <div class="v num">${fmtUsd(displayAmount(pricing.grandTotal, itinerary))}</div>
      <div class="s">${fmtUsd(pricing.perPerson)} / person · ${pricing.pax} pax</div>
    `;

    return pricing;
  }

  document.getElementById('f-markup').addEventListener('input', (e) => {
    itinerary.pricing.markupPercentOverride = Number(e.target.value);
    saveItinerary(itinerary);
    render();
  });
  document.getElementById('toggle-pp').addEventListener('click', () => {
    itinerary.pricing.displayMode = 'perPerson'; saveItinerary(itinerary); render();
  });
  document.getElementById('toggle-tb').addEventListener('click', () => {
    itinerary.pricing.displayMode = 'totalBreakdown'; saveItinerary(itinerary); render();
  });
  document.getElementById('btn-back').addEventListener('click', () => window.location.href = 'transportation.html');
  document.getElementById('btn-preview').addEventListener('click', () => window.location.href = 'itinerary-preview.html');
  document.getElementById('btn-generate').addEventListener('click', async () => {
    const btn = document.getElementById('btn-generate');
    btn.disabled = true;
    const pricing = computePricing(itinerary, cfg.vehicles, cfg.pricingSettings);
    try {
      await pushSavedItinerary({
        id: 'itn_' + Date.now(),
        savedAt: new Date().toISOString(),
        clientName: itinerary.tripBasics.clientName,
        duration: nightsDaysBetween(itinerary.tripBasics.arrivalDate, itinerary.tripBasics.departureDate),
        pax: pricing.pax,
        cities: itinerary.hotels.map(h => h.cityName),
        grandTotal: pricing.grandTotal,
        perPerson: pricing.perPerson,
        displayMode: itinerary.pricing.displayMode,
        itinerarySnapshot: itinerary,
      });
    } catch (e) {
      toast('Could not save — make sure the server is running (npm start).');
      btn.disabled = false;
      return;
    }
    clearItinerary();
    toast('Itinerary saved.');
    setTimeout(() => window.location.href = 'existing-itineraries.html', 700);
  });

  render();
})();
</script>
</body>
</html>
